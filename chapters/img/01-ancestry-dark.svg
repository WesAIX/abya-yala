<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Приходы и смешения по данным палеогенетики (схема)</title><desc id='d'>От группы основателей отходят древние берингийцы и предки остальных коренных американцев, разошедшиеся на северную и южную ветви. Из Сибири отдельно приходят палеоэскимосы. Линия, родственная палеоэскимосам, смешивается с северной ветвью — так складываются предки на-дене и предки эскимосско-алеутских народов; от последних с туле линия расходится к юпикам и инуитам. «Популяция Y» — гипотеза.</desc>
