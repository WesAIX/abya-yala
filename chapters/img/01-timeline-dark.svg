<title id='t'>Последовательность событий заселения Америки</title><desc id='d'>Следы в Уайт-Сэндс: 23–21 тыс. лет назад — спорно; Расхождение северной и южной ветвей: 17,5–14,6 тыс. лет назад; Прибрежный путь открыт: ≈ 17 тыс. лет назад; Купер-Ферри, древнейшая стадия: 16,56–15,28 тыс. лет назад; Монте-Верде, верхний слой: 14,22–13,98 тыс. лет назад — спорно (2026); Безлёдный коридор открыт целиком: 13,8 ± 0,5 тыс. лет назад; Кловис: 13,05–12,75 тыс. лет назад; Коридор пригоден для жизни: ≈ 12,6 тыс. лет назад; Берингия затоплена: ≈ 11 тыс. лет назад.</desc>
