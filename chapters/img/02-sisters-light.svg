<title id='t'>Как собирались «три сестры» на востоке и на юго-западе</title><desc id='d'>Восток — тыква (своё растение): ≈3050 г. до н. э., подсолнечник (своё растение): ≈2900 г. до н. э., Iva annua (своё растение): ≈2450 г. до н. э., марь, набор из пяти культур (своё растение): ≈1850 г. до н. э., кукуруза на северо-востоке — спорно (пришло): ≈350 г. до н. э., кукуруза на Огайо (пришло): ≈550 г., кукуруза — важная культура (рост роли): ≈850 г., фасоль (пришло): ≈1050 г., фасоль на северо-востоке (пришло): ≈1250 г.; Юго-Запад — кукуруза (не позже) (пришло): ≈2100 г. до н. э., тыква (пришло): ≈1200 г. до н. э., фасоль (с амарантом и хлопком) (пришло): 800 г. до н. э. – 300 г., кукуруза кормит нагорья (рост роли): около рубежа эр.</desc>
