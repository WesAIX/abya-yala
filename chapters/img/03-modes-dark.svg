<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 558" width="760" height="558" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Четыре пути, которыми вещь или человек проходили далеко (схема)</title><desc id='d'>Эстафета: вещь переходит от общины к общине, и находок тем меньше, чем дальше от источника. Целевой поход: люди потребителя сами ходят к источнику и обратно, между ними находок нет. Промежуточный центр: птиц из природного ареала разводят в поселении на полпути, и все птицы у потребителей — потомки немногих предков. Переселение: движутся сами люди, и стронций в их зубах не совпадает с местным. Расстояния и число участников условные.</desc>
<rect width="760" height="558" fill="#141A18"/>
<defs>
<marker id="head-thing" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.0" markerHeight="5.0" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#BA8628"/></marker>
<marker id="head-people" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.0" markerHeight="5.0" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2A9CC4"/></marker>
<marker id="head-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.0" markerHeight="5.0" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97A59E"/></marker>
<pattern id="hatch-people" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#141A18"/><line x1="0" y1="0" x2="0" y2="4" stroke="#2A9CC4" stroke-width="2"/></pattern>
<filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
