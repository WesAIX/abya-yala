<title id='t'>Сколько людей жило в крупнейших городах: оценки разных авторов</title><desc id='d'>Полосы и точки на логарифмической шкале от тысячи до миллиона жителей. Кахокия — Милнер: несколько тысяч; Кахокия — Холт: 10 000 или 20 000; Кахокия — Паукетат и Лопино: 10 200–15 300; Теотиуакан — Миллон: 75 000–200 000; Теотиуакан — Коуджилл: 85 000–125 000; Теотиуакан — Смит и соавт., 2019: ≈100 000; Теночтитлан — Эванс: 35 000–75 000; Теночтитлан — Эванс: ≈50 000; Теночтитлан — Осса, Смит и Лобо: ≈200 000; Теночтитлан — Эванс: ≈500 000.</desc>
