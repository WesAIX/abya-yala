<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Как работает и как ломается самотёчный канал (схема)</title><desc id='d'>Три условных поперечных профиля реки с каналом, отходящим от правого берега. 1 — канал работает: уровень реки выше дна канала, вода сама идёт к полям. 2 — река ниже водозабора: русло врезалось или выше по реке воду забрали новые каналы, канал сухой; так объясняют распад сети около 1070 г., что верно — спорят. 3 — паводок выше берегов: в 1356–1384 гг. очень высокие паводки чередовались с маловодьем и могли разрушать водозаборы. Каналы хохокам на Солт-Ривер — больше 500 км, поливали, возможно, до 650 км² полей.</desc>
<rect width="760" height="420" fill="#141A18"/>
<defs><marker id="head-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#E2E8E3"/></marker></defs>
<text x="16.0" y="30.0" fill="#E2E8E3" font-size="17" text-anchor="start" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Самотёчный канал: вода идёт в него, только пока река стоит выше его дна</text>
<text x="16.0" y="52.0" fill="#97A59E" font-size="12.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Каналы хохокам на Солт-Ривер — больше 500 км; ими поливали, возможно, до 650 км² полей</text>
<rect x="16.0" y="86.0" width="236.0" height="196.0" rx="4" fill="#1F2825" fill-opacity="1" stroke="#2E3934"/>
<text x="26.0" y="108.0" fill="#E2E8E3" font-size="13.5" text-anchor="start" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1. Канал работает</text>
<polygon points="16.0,182.0 34.0,182.0 48.0,236.0 114.0,236.0 128.0,210.0 252.0,210.0 252.0,282.0 16.0,282.0" fill="#97A59E" fill-opacity="0.32"/>
<polygon points="128.0,182.0 252.0,182.0 252.0,210.0 128.0,210.0" fill="#97A59E" fill-opacity="0.12"/>
<polyline points="16.0,182.0 34.0,182.0 48.0,236.0 114.0,236.0 128.0,210.0 252.0,210.0" fill="none" stroke="#97A59E" stroke-width="1.2" stroke-linejoin="round"/>
<polyline points="128.0,182.0 252.0,182.0" fill="none" stroke="#97A59E" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="36.6,192.0 252.0,192.0 252.0,210.0 128.0,210.0 114.0,236.0 48.0,236.0" fill="#2A9CC4" fill-opacity="0.55"/>
<line x1="36.6" y1="192.0" x2="252.0" y2="192.0" stroke="#2A9CC4" stroke-width="1.6" stroke-opacity="1.0"/>
<text x="81.0" y="228.0" fill="#E2E8E3" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic" paint-order="stroke" stroke="#1F2825" stroke-width="4" stroke-linejoin="round">река</text>
<path d="M140.0,203.0L240.0,203.0" stroke="#E2E8E3" stroke-width="1.4" marker-end="url(#head-ink)"/>
<text x="242.0" y="174.0" fill="#E2E8E3" font-size="11.5" text-anchor="end" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#1F2825" stroke-width="4" stroke-linejoin="round">канал — к полям</text>
<text x="132.0" y="226.0" fill="#97A59E" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#1F2825" stroke-width="4" stroke-linejoin="round">водозабор</text>
<text x="18.0" y="306.0" fill="#E2E8E3" font-size="12" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">река стоит выше дна канала —</text>
<text x="18.0" y="322.0" fill="#E2E8E3" font-size="12" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">вода сама идёт к полям</text>
<rect x="266.0" y="86.0" width="236.0" height="196.0" rx="4" fill="#1F2825" fill-opacity="1" stroke="#2E3934"/>
<text x="276.0" y="108.0" fill="#E2E8E3" font-size="13.5" text-anchor="start" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">2. Река ниже водозабора</text>
<polygon points="266.0,182.0 284.0,182.0 298.0,266.0 364.0,266.0 378.0,210.0 502.0,210.0 502.0,282.0 266.0,282.0" fill="#97A59E" fill-opacity="0.32"/>
<polygon points="378.0,182.0 502.0,182.0 502.0,210.0 378.0,210.0" fill="#97A59E" fill-opacity="0.12"/>
<polyline points="266.0,182.0 284.0,182.0 298.0,266.0 364.0,266.0 378.0,210.0 502.0,210.0" fill="none" stroke="#97A59E" stroke-width="1.2" stroke-linejoin="round"/>
<polyline points="378.0,182.0 502.0,182.0" fill="none" stroke="#97A59E" stroke-width="0.8" stroke-linejoin="round"/>
<line x1="292.4" y1="236.0" x2="369.6" y2="236.0" stroke="#E2E8E3" stroke-width="1.1" stroke-opacity="1.0" stroke-dasharray="3 3"/>
<polygon points="294.7,246.0 367.3,246.0 364.0,266.0 298.0,266.0" fill="#2A9CC4" fill-opacity="0.55"/>
<line x1="294.7" y1="246.0" x2="367.3" y2="246.0" stroke="#2A9CC4" stroke-width="1.6" stroke-opacity="1.0"/>
<text x="331.0" y="258.0" fill="#E2E8E3" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic" paint-order="stroke" stroke="#1F2825" stroke-width="4" stroke-linejoin="round">река</text>
<text x="492.0" y="174.0" fill="#E2E8E3" font-size="11.5" text-anchor="end" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#1F2825" stroke-width="4" stroke-linejoin="round">канал сухой</text>
<text x="382.0" y="226.0" fill="#97A59E" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#1F2825" stroke-width="4" stroke-linejoin="round">водозабор</text>
<text x="286.0" y="230.0" fill="#E2E8E3" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#1F2825" stroke-width="4" stroke-linejoin="round">прежнее дно</text>
<text x="268.0" y="306.0" fill="#E2E8E3" font-size="12" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">русло врезалось или выше по реке</text>
<text x="268.0" y="322.0" fill="#E2E8E3" font-size="12" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">воду забрали новые каналы —</text>
<text x="268.0" y="338.0" fill="#97A59E" font-size="12" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">так объясняют распад ≈1070 г.;</text>
<text x="268.0" y="354.0" fill="#97A59E" font-size="12" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">что из этого верно, спорят</text>
<rect x="516.0" y="86.0" width="236.0" height="196.0" rx="4" fill="#1F2825" fill-opacity="1" stroke="#2E3934"/>
<text x="526.0" y="108.0" fill="#E2E8E3" font-size="13.5" text-anchor="start" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">3. Паводок выше берегов</text>
<polygon points="516.0,182.0 534.0,182.0 548.0,236.0 614.0,236.0 628.0,210.0 752.0,210.0 752.0,282.0 516.0,282.0" fill="#97A59E" fill-opacity="0.32"/>
<polygon points="628.0,182.0 752.0,182.0 752.0,210.0 628.0,210.0" fill="#97A59E" fill-opacity="0.12"/>
<polyline points="516.0,182.0 534.0,182.0 548.0,236.0 614.0,236.0 628.0,210.0 752.0,210.0" fill="none" stroke="#97A59E" stroke-width="1.2" stroke-linejoin="round"/>
<polyline points="628.0,182.0 752.0,182.0" fill="none" stroke="#97A59E" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="516.0,156.0 752.0,156.0 752.0,210.0 628.0,210.0 614.0,236.0 548.0,236.0 534.0,182.0 516.0,182.0" fill="#2A9CC4" fill-opacity="0.55"/>
<line x1="516.0" y1="156.0" x2="752.0" y2="156.0" stroke="#2A9CC4" stroke-width="1.6" stroke-opacity="1.0"/>
<text x="581.0" y="228.0" fill="#E2E8E3" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic" paint-order="stroke" stroke="#1F2825" stroke-width="4" stroke-linejoin="round">река</text>
<polyline points="626.0,184.0 636.0,191.0 629.0,198.0 638.0,208.0" fill="none" stroke="#E2E8E3" stroke-width="1.6" stroke-linejoin="round"/>
<text x="646.0" y="200.0" fill="#E2E8E3" font-size="11.5" text-anchor="start" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#1F2825" stroke-width="4" stroke-linejoin="round">водозабор</text>
<text x="646.0" y="214.0" fill="#E2E8E3" font-size="11.5" text-anchor="start" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#1F2825" stroke-width="4" stroke-linejoin="round">размыт</text>
<text x="518.0" y="306.0" fill="#E2E8E3" font-size="12" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1356–1384 гг.: очень высокие паводки</text>
<text x="518.0" y="322.0" fill="#E2E8E3" font-size="12" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">чередовались с маловодьем —</text>
<text x="518.0" y="338.0" fill="#97A59E" font-size="12" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">могли разрушать водозаборы</text>
<text x="16.0" y="390.0" fill="#E2E8E3" font-size="14" text-anchor="start" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Схема: профили условные, без масштаба.</text>
<text x="16.0" y="408.0" fill="#97A59E" font-size="12" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Показаны только объяснения, связанные с водой; третье — беспорядки на северной окраине — схема не показывает.</text>
</svg>
