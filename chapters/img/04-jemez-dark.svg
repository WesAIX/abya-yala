<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Население провинции Хемес, 1480–1700 гг.</title><desc id='d'>По горизонтали годы 1480–1700, по вертикали — число жителей. около 1500 г.: 4951–7922 (по развалинам); 1621: 6566 (по документам); 1630: 3000 (по документам); 1644: 1860 (по документам); начало 1680-х гг.: не больше 833 (по развалинам); 1694: меньше 600 (по документам). Вехи: 1541 — первая встреча с испанцами; 1598 — испанская колония; 1620-е гг. — приход миссий; 1680 — восстание пуэбло. Убыль за 1620–1680 гг. — 87% (с ≈6500 до меньше 850).</desc>
