<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Население центральной части Меса-Верде, 600–1280 гг., и «Великая засуха»</title><desc id='d'>Ступенчатый график: по горизонтали годы 600–1300, по вертикали — среднее число жителей одновременно. По периодам (жителей ± 80-процентный интервал): 600–725: 2931 ± 684; 725–800: 3537 ± 564; 800–840: 10 523 ± 1777; 840–880: 11 518 ± 1798; 880–920: 4731 ± 847; 920–980: 4158 ± 895; 980–1020: 8589 ± 1876; 1020–1060: 9382 ± 2018; 1060–1100: 14 634 ± 2705; 1100–1140: 20 741 ± 3824; 1140–1180: 20 998 ± 4498; 1180–1225: 19 178 ± 4830; 1225–1260: 26 695 ± 8303; 1260–1280: 21 792 ± 8209. Через несколько лет после 1280 г. — никого. Штриховкой — «Великая засуха» 1276–1299 гг.: она начинается, когда население уже падает.</desc>
