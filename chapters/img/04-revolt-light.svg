<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Восстание пуэбло 1680 г. и после (схема)</title><desc id='d'>Карта Нью-Мексико и соседних земель. Пуэбло — точками без границ земель: Таос (отсюда Попе разослал верёвку с узлами), Пикурис, Сан-Хуан (Окай-Овинге), Санта-Клара, Сия, Санта-Ана и Сан-Фелипе (в 1690-х — на стороне испанцев), Ислета (не участвовала; около 1500 беженцев), хопи. Квадратами — Санта-Фе, где собрались уцелевшие испанцы, и Эль-Пасо. Стрелки отступления испанцев ведут от Санта-Фе и Ислеты к Эль-Пасо (конец сентября 1680 г.). Стрелки от Санта-Клары и Пикуриса ведут на равнины, к союзникам-апачам в Эль-Куартелехо (октябрь 1696 г.). Пунктир от Таоса до хопи — бег 1980 г. со шнуром с узлами в память о гонцах 1680 г. Положение точек ориентировочное.</desc>
