<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Великая убыль и её след в атмосфере</title><desc id='d'>Слева — население обеих Америк: 1492 г. — 60,5 млн (44,8–78,2), 1600 г. — 6,1 млн (4,5–7,8); убыль 90% (87–92%) за столетие. Справа — след: заброшенные земли 55,8 млн га (39,0–78,4), связанный лесом углерод 7,4 Пг (4,9–10,8), падение CO2 по модели 3,5 ppm (2,3–5,1) против наблюдаемого провала 7–10 ppm, охлаждение около 0,15 °C. Полосы — межквартильные размахи статьи Koch et al. 2019.</desc>
