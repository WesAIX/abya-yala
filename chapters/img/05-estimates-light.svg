<title id='t'>Сколько людей жило в Америках в 1492 году</title><desc id='d'>Семь строк по регионам, на каждой — оценки разных авторов точками и диапазонами на логарифмической шкале от 0,3 до 130 млн человек. Обе Америки целиком: 6 оценок; Карибы: 4 оценок; Мексика: 5 оценок; Центральная Америка: 4 оценок; Анды: 3 оценок; Северная Америка (США и Канада): 5 оценок; Низинная Южная Америка: 6 оценок. Полушарие: Кробер и др. 8–15; Уитмор 43; Добинс 90 и 112; Деневан 53,9; Кох и соавторы 60,5 (44,8–78,2). Разброс оценок — позиция авторов, средней линии нет намеренно.</desc>
