<line x1="420.0" y1="180.0" x2="408.0" y2="180.0" stroke="#B03A84" stroke-width="1.1" stroke-opacity="0.8"/>
<rect x="420.0" y="198.0" width="300.0" height="24.0" rx="4" fill="#F8FAF6" fill-opacity="0.9"/>
<text x="570.0" y="214.5" fill="#5B6862" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">голод, разруха хозяйства</text>
<line x1="420.0" y1="210.0" x2="408.0" y2="210.0" stroke="#B03A84" stroke-width="1.1" stroke-opacity="0.8"/>
<rect x="420.0" y="228.0" width="300.0" height="24.0" rx="4" fill="#F8FAF6" fill-opacity="0.9"/>
<text x="570.0" y="244.5" fill="#5B6862" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">некому ухаживать за больными</text>
<line x1="420.0" y1="240.0" x2="408.0" y2="240.0" stroke="#B03A84" stroke-width="1.1" stroke-opacity="0.8"/>
<line x1="420.0" y1="76.0" x2="408.0" y2="76.0" stroke="#B03A84" stroke-width="1.1" stroke-opacity="0.8"/>
<path d="M408,76V252.0" stroke="#B03A84" stroke-width="1.4" fill="none" opacity=".85"/>
<path d="M408,252.0H570V292" stroke="#B03A84" stroke-width="2.2" fill="none" marker-end="url(#head-v2)"/>
<text x="398.0" y="168.0" fill="#5B6862" font-size="11.5" text-anchor="end" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">вместе</text>
<rect x="420.0" y="296.0" width="300.0" height="74.0" rx="5" fill="#B03A84" fill-opacity="0.22"/>
<text x="570.0" y="324.0" fill="#1B2420" font-size="12.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">смертность</text>
<text x="570.0" y="342.0" fill="#5B6862" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">не свойство болезни, а свойство ситуации</text>
<text x="380.0" y="408.0" fill="#1B2420" font-size="12.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Схема: болезнь одна и та же; слева она одна, справа — среди войны, рабства и голода</text>
<text x="380.0" y="422.0" fill="#5B6862" font-size="11" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">список факторов — по Джонсу (2003), дословно в тексте главы</text>
</svg>
