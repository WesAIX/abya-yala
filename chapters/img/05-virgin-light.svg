<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Две картины смертности</title><desc id='d'>Слева — модель девственной почвы Кросби: популяция без иммунитета к новой болезни — высокая смертность (одно звено, одна причина). Справа — после критики Джонса: болезнь и пять факторов — война и резня, бегство и потеря урожая, рабство и угон в плен, голод и разруха хозяйства, некому ухаживать за больными — сходятся вместе к смертности. Смертность — не свойство болезни, а свойство ситуации. Схема.</desc>
<rect width="760" height="430" fill="#EDF0EA"/>
<defs>
<marker id="head-v1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5B6862"/></marker>
<marker id="head-v2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B03A84"/></marker>
</defs>
<text x="190.0" y="40.0" fill="#1B2420" font-size="13.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">модель «девственной почвы»</text>
<rect x="40.0" y="56.0" width="300.0" height="74.0" rx="5" fill="#5B6862" fill-opacity="0.1"/>
<text x="190.0" y="84.0" fill="#1B2420" font-size="12.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">популяция без иммунитета</text>
<text x="190.0" y="102.0" fill="#5B6862" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">к новой болезни</text>
<path d="M190,134L190,168" stroke="#5B6862" stroke-width="2.2" marker-end="url(#head-v1)"/>
<rect x="40.0" y="176.0" width="300.0" height="74.0" rx="5" fill="#5B6862" fill-opacity="0.16"/>
<text x="190.0" y="204.0" fill="#1B2420" font-size="12.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">высокая смертность</text>
<text x="190.0" y="222.0" fill="#5B6862" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">смертность — свойство болезни</text>
<text x="190.0" y="286.0" fill="#5B6862" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">одно звено, одна причина</text>
<text x="570.0" y="40.0" fill="#1B2420" font-size="13.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">после критики Джонса (2003)</text>
<rect x="420.0" y="56.0" width="300.0" height="40.0" rx="5" fill="#B03A84" fill-opacity="0.18"/>
<text x="570.0" y="81.0" fill="#1B2420" font-size="12.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">болезнь</text>
<rect x="420.0" y="108.0" width="300.0" height="24.0" rx="4" fill="#F8FAF6" fill-opacity="0.9"/>
<text x="570.0" y="124.5" fill="#5B6862" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">война и резня</text>
<line x1="420.0" y1="120.0" x2="408.0" y2="120.0" stroke="#B03A84" stroke-width="1.1" stroke-opacity="0.8"/>
<rect x="420.0" y="138.0" width="300.0" height="24.0" rx="4" fill="#F8FAF6" fill-opacity="0.9"/>
<text x="570.0" y="154.5" fill="#5B6862" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">бегство, потеря урожая</text>
<line x1="420.0" y1="150.0" x2="408.0" y2="150.0" stroke="#B03A84" stroke-width="1.1" stroke-opacity="0.8"/>
