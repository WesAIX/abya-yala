<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 514" width="760" height="514" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Волны эпидемий по регионам, XVI–XIX века</title><desc id='d'>Шкала 1505–1860 с шестью дорожками. Карибы: оспа 1518–1519. Мезоамерика: оспа 1520–1521 (5–8 млн погибших по одной сводке, 30–50% населения — по другой) и кокольицтли 1545–1548 (5–15 млн) и 1576–1581 (2–2,5 млн). Анды: оспа? 1520-е — диагноз спорен. Северо-восток: неизвестная болезнь 1616–1619, гипотеза — лептоспироз. Юго-Восток: оспа 1696–1700. Равнины: оспа 1781–1782 и 1837–1838. Полосы размыты там, где даты приблизительны.</desc>
