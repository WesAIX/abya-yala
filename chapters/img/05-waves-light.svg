<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 652" width="760" height="652" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Волны эпидемий по регионам, XVI–XIX века</title><desc id='d'>Шкала 1505–1860 с шестью дорожками; волна — полоса на своей ступеньке над или под осью дорожки. Карибы: оспа 1518–1519. Мезоамерика: оспа 1520–1521 (5–8 млн погибших по одной сводке, 30–50% населения — по другой), кокольицтли 1545–1548 (5–15 млн) и кокольицтли 1576–1581 (2–2,5 млн). Анды: оспа? 1520-е — диагноз спорен. Северо-восток: неизвестная болезнь 1616–1619, гипотеза — лептоспироз. Юго-восток: оспа 1696–1700. Равнины: оспа 1781–1782 и 1837–1838. Размытые полосы — приблизительные даты.</desc>
