<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 678" width="760" height="678" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Сколько держались: от первого столкновения до утраты самостоятельности</title><desc id='d'>Полосы на шкале 1519–1700. Тройственный союз: 1519–1521, 2 года. Тауантинсуйу: 1532–1533, далее государством руководили из Вилькабамбы (1536–1572, 36 лет) — отдельная строка. Майя Юкатана: 1527–1546. Ица: 1527–1697, 170 лет, с пометкой, что полоса ведётся от высадки Монтехо, а сами ица не воевали всё это время. Пурепеча: 1522–1530, полоса пунктиром — сдались без разгрома, конец — казнь касонси. «Чичимеки»: 1549–1591. Мапуче: от 1541 без конца — не покорены; парламенты. Цвет — культурная зона.</desc>
