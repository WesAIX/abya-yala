<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Кто осаждал Теночтитлан в 1521 году</title><desc id='d'>Парные полосы по соединениям осады: тёмная — испанцы (пехота, всадники, стрелки), светлая — индейские союзники. Альварадо под Такубой: 198 испанцев и 8000 тлашкальтеков; Олид под Койоаканом: 215 и 8000; Сандоваль у Истапалапана: 188 и 8000 воинов чалько и уэшоцинко; Кортес на бригантинах: 325. Ниже — 150 000 воинов-союзников, общая оценка Кортеса (у Прескотта, с оговоркой «если верить Кортесу»). Итог по спискам: 926 испанцев и 24 000 союзников. Шкала логарифмическая.</desc>
