<text x="726.0" y="330.0" fill="#E2E8E3" font-size="12.5" text-anchor="end" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Итого по спискам Диаса: 926 испанцев и 24 000 союзников — больше двадцати на каждого</text>
