<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Переключение пирамиды власти</title><desc id='d'>Две колонки. Мезоамерика: зачёркнутая вершина «Тройственный союз — столицы и склады дани» заменена на «корона и энкомьендеро»; ниже, без изменений, — «местные правители, сбор дани по спискам» и «общины-плательщики». Анды: вершина «Тауантинсуйу — Инка, дороги, склады» заменена на «корона и рудники Потоси»; ниже — «повинность мита, учёт на кипу» и «общины-работники». Захвачен только верхний ярус. Внизу: осада Теночтитлана — 926 испанцев и 24 000 союзников; мита с 1573 г. — одна седьмая взрослых мужчин, около 13 000 в год. Схема: упрощение.</desc>
<rect width="760" height="470" fill="#141A18"/>
<defs>
<marker id="head-sw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#CF60A5"/></marker>
</defs>
<text x="200.0" y="34.0" fill="#E2E8E3" font-size="16" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Мезоамерика</text>
<rect x="60.0" y="54.0" width="280.0" height="46.0" rx="4" fill="#97A59E" fill-opacity="0.22"/>
<text x="200.0" y="74.0" fill="#97A59E" font-size="12.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Тройственный союз</text>
<text x="200.0" y="90.0" fill="#97A59E" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">столицы и склады дани</text>
<line x1="68.0" y1="77.0" x2="332.0" y2="77.0" stroke="#E2E8E3" stroke-width="2.2" stroke-opacity="1.0"/>
<rect x="60.0" y="122.0" width="280.0" height="46.0" rx="4" fill="#CF60A5" fill-opacity="0.8"/>
<text x="200.0" y="142.0" fill="#E2E8E3" font-size="12.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#CF60A5" stroke-width="4" stroke-linejoin="round">корона и энкомьендеро</text>
<text x="200.0" y="158.0" fill="#E2E8E3" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#CF60A5" stroke-width="4" stroke-linejoin="round">захвачен этот ярус</text>
<path d="M86.0,100L86.0,116" stroke="#CF60A5" stroke-width="2" marker-end="url(#head-sw)"/>
<rect x="60.0" y="184.0" width="280.0" height="40.0" rx="4" fill="#62A443" fill-opacity="0.3"/>
<text x="200.0" y="201.0" fill="#97A59E" font-size="11.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">не меняется:</text>
<text x="200.0" y="216.0" fill="#E2E8E3" font-size="12" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">местные правители, сбор дани по спискам</text>
<rect x="60.0" y="234.0" width="280.0" height="40.0" rx="4" fill="#62A443" fill-opacity="0.16"/>
<text x="200.0" y="258.0" fill="#E2E8E3" font-size="12" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">общины-плательщики</text>
<text x="200.0" y="300.0" fill="#97A59E" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">осада Теночтитлана: 926 испанцев</text>
<text x="200.0" y="315.0" fill="#97A59E" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">и 24 000 союзников (Диас)</text>
<text x="560.0" y="34.0" fill="#E2E8E3" font-size="16" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Анды</text>
<rect x="420.0" y="54.0" width="280.0" height="46.0" rx="4" fill="#97A59E" fill-opacity="0.22"/>
<text x="560.0" y="74.0" fill="#97A59E" font-size="12.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Тауантинсуйу</text>
<text x="560.0" y="90.0" fill="#97A59E" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Инка, дороги, склады</text>
<line x1="428.0" y1="77.0" x2="692.0" y2="77.0" stroke="#E2E8E3" stroke-width="2.2" stroke-opacity="1.0"/>
<rect x="420.0" y="122.0" width="280.0" height="46.0" rx="4" fill="#CF60A5" fill-opacity="0.8"/>
<text x="560.0" y="142.0" fill="#E2E8E3" font-size="12.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#CF60A5" stroke-width="4" stroke-linejoin="round">корона и рудники Потоси</text>
<text x="560.0" y="158.0" fill="#E2E8E3" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#CF60A5" stroke-width="4" stroke-linejoin="round">захвачен этот ярус</text>
<path d="M446.0,100L446.0,116" stroke="#CF60A5" stroke-width="2" marker-end="url(#head-sw)"/>
<rect x="420.0" y="184.0" width="280.0" height="40.0" rx="4" fill="#62A443" fill-opacity="0.3"/>
<text x="560.0" y="201.0" fill="#97A59E" font-size="11.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">не меняется:</text>
<text x="560.0" y="216.0" fill="#E2E8E3" font-size="12" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">повинность мита, учёт на кипу</text>
<rect x="420.0" y="234.0" width="280.0" height="40.0" rx="4" fill="#62A443" fill-opacity="0.16"/>
<text x="560.0" y="258.0" fill="#E2E8E3" font-size="12" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">общины-работники</text>
<text x="560.0" y="300.0" fill="#97A59E" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">с 1573 г. — одна седьмая взрослых</text>
<text x="560.0" y="315.0" fill="#97A59E" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">мужчин, около 13 000 в год (сводки)</text>
<text x="380.0" y="356.0" fill="#E2E8E3" font-size="12.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Стрелка не значит, что люди те же: меняется адресат дани и труда,</text>
<text x="380.0" y="373.0" fill="#E2E8E3" font-size="12.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">а общины и знать поначалу остаются на местах</text>
<text x="380.0" y="444.0" fill="#97A59E" font-size="12.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#141A18" stroke-width="4" stroke-linejoin="round">Схема: упрощение — обе державы устроены сложнее (гл. 3)</text>
<text x="380.0" y="460.0" fill="#97A59E" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">числа — в тексте главы со сносками</text>
</svg>
