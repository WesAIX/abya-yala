<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 606" width="760" height="606" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Когда народы равнин получили лошадей</title><desc id='d'>Шкала 1630–1815, по строке на народ: юты около 1640 (традиция); равнинные апачи 1659 (угон скота — документ); кайова 1682 (торговля лошадьми); каддо 1690 («нет хижины без четырёх-пяти лошадей»); команчи 1705–1706 (первые записи); северные шошоны 1729–1734 (рассказ Сокамопи); арикара и деревни Миссури 1738; арапахо с 1740-х; кроу к 1750; лакота 1750–1775; шайенны около 1766; ассинибойны около 1766; черноногие 1772 (все конные); равнинные кри 1789; равнинные оджибве 1800–1806. Форма метки — надёжность: круг — запись современника, ромб — традиция или оценка.</desc>
