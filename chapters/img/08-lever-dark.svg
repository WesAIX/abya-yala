<text x="390.0" y="181.0" fill="#97A59E" font-size="12.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Британия — ушла</text>
<rect x="290.0" y="204.0" width="200.0" height="44.0" rx="5" fill="#1F2825" fill-opacity="0.95"/>
<text x="390.0" y="223.0" fill="#E2E8E3" font-size="12.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">народы</text>
<text x="390.0" y="258.0" fill="#97A59E" font-size="11" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">«уступает Канаду со всеми</text>
<text x="390.0" y="273.0" fill="#97A59E" font-size="11" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">зависимостями» — Париж, ст. IV</text>
<text x="640.0" y="30.0" fill="#E2E8E3" font-size="13" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1815: Британия сдаёт</text>
<rect x="540.0" y="52.0" width="200.0" height="40.0" rx="5" fill="#2A9CC4" fill-opacity="0.85"/>
<text x="640.0" y="77.0" fill="#E2E8E3" font-size="12.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Испания*</text>
<path d="M640.0,96.0L640.0,196.0" stroke="#2A9CC4" stroke-width="1.6" marker-end="url(#head-l8)" opacity=".7"/>
