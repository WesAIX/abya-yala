<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Рычаг противоречий и его поломка</title><desc id='d'>Три карточки-колонки. 1650–1763: три державы — Испания, Франция, Британия — тянутся стрелками к народу в центре: народ может выбирать и назначать цену. 1763: Франция «уступает Канаду со всеми зависимостями» (Париж, ст. IV) — карточка гаснет. 1815: Британия сдаёт — статья IX Гента не исполнена; рычага больше нет. Схема по тезису № 5.</desc>
<rect width="760" height="400" fill="#141A18"/>
<defs>
<marker id="head-l8" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2A9CC4"/></marker>
</defs>
<text x="140.0" y="30.0" fill="#E2E8E3" font-size="13" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1650–1763: три державы</text>
<rect x="40.0" y="52.0" width="200.0" height="40.0" rx="5" fill="#2A9CC4" fill-opacity="0.85"/>
<text x="140.0" y="77.0" fill="#E2E8E3" font-size="12.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Испания</text>
