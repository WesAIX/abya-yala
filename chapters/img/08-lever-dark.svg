<text x="130.0" y="297.0" fill="#97A59E" font-size="11" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">выбирать и назначать цену</text>
