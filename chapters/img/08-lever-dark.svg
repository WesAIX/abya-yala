<text x="640.0" y="129.0" fill="#97A59E" font-size="12.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Франция — ушла</text>
<rect x="540.0" y="156.0" width="200.0" height="40.0" rx="5" fill="#97A59E" fill-opacity="0.18"/>
<text x="640.0" y="181.0" fill="#97A59E" font-size="12.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Британия — ушла</text>
<rect x="540.0" y="204.0" width="200.0" height="44.0" rx="5" fill="#1F2825" fill-opacity="0.95"/>
<text x="640.0" y="223.0" fill="#E2E8E3" font-size="12.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">народы</text>
<text x="640.0" y="258.0" fill="#97A59E" font-size="11" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">ст. IX Гента не исполнена;</text>
<text x="640.0" y="273.0" fill="#97A59E" font-size="11" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">рычага больше нет — гл. 9</text>
<text x="380.0" y="366.0" fill="#E2E8E3" font-size="12.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Схема по тезису № 5: сила союзов пропорциональна числу держав, которым народ нужен</text>
<text x="380.0" y="382.0" fill="#97A59E" font-size="11" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">* Испания остаётся на окраинах материка; даты и формулы — в тексте главы</text>
</svg>
