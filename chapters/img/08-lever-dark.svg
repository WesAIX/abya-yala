<text x="380.0" y="297.0" fill="#97A59E" font-size="11" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">зависимостями» — Париж, ст. IV</text>
<text x="630.0" y="32.0" fill="#E2E8E3" font-size="13" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1815: Британия сдаёт</text>
