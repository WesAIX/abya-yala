<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Рычаг противоречий и его поломка</title><desc id='d'>Три карточки-колонки. 1650–1763: три державы — Испания, Франция, Британия — соединены линиями давления с народами: народ может выбирать и назначать цену. 1763: Франция «уступает Канаду со всеми зависимостями» (Париж, ст. IV) — её гнездо пустеет, линий давления две. 1815: Британия сдаёт — статья IX Гента не исполнена; линия одна. Схема по тезису № 5.</desc>
<rect width="760" height="372" fill="#141A18"/>
