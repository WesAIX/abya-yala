</defs>
<text x="130.0" y="32.0" fill="#E2E8E3" font-size="13" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1650–1763: три державы</text>
