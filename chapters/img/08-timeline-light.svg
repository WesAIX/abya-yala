<title id='t'>Эпоха баланса одной шкалой, 1640–1820</title><desc id='d'>Три дорожки. Северо-восток: «бобровые войны» 1649–1651; Монреаль 1701; Утрехт 1713; нейтралитет 1753; Париж 1763; война Понтиака 1763–1766; прокламация 1763; раскол 1777; Гранд-Ривер 1784; разгром Сент-Клэра 1791; Гринвилл 1795; Форт-Уэйн 1809; Типпекану 1811; Темза 1813; Гент 1814. Юго-восток: политика Брима 1718; чикасские войны 1721–1763; гражданская война чокто 1747–1750; Хорсшу-Бенд и форт-Джексон 1814. Параллельный юг: Кильин 1641; Негрете 1803. Цвет — тип события.</desc>
