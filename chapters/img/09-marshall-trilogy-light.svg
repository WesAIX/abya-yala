<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Трилогия Маршалла и конец договорного периода</title><desc id='d'>Четыре карточки-ступени. 1823, Johnson v. M'Intosh: доктрина открытия — частные покупки у индейцев недействительны; «завоевание даёт титул, который суды завоевателя не могут отрицать». 1831, Cherokee Nation v. Georgia: «внутренние зависимые нации», отношения «подопечного к опекуну». 1832, Worcester v. Georgia: нация чероки — «обособленное сообщество», законы Джорджии не имеют силы (на практике не исполнено). 1871: конец договорного периода — племена не признаются независимыми нациями, старые договоры сохраняют силу. Схема по текстам решений.</desc>
<rect width="760" height="470" fill="#EDF0EA"/>
<defs>
<marker id="head-m9" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#007A9A"/></marker>
</defs>
<rect x="34.0" y="120.0" width="168.0" height="210.0" rx="6" fill="#F8FAF6" fill-opacity="0.95"/>
<rect x="34.0" y="120.0" width="168.0" height="50.0" rx="6" fill="#007A9A" fill-opacity="0.9"/>
<text x="118.0" y="141.0" fill="#EDF0EA" font-size="14" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1823</text>
<text x="118.0" y="156.0" fill="#EDF0EA" font-size="11" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Johnson v. M'Intosh</text>
<text x="46.0" y="192.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">доктрина открытия:</text>
<text x="46.0" y="207.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">частные лица не могут</text>
<text x="46.0" y="222.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">покупать землю у</text>
<text x="46.0" y="237.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">индейцев; титул — у</text>
<text x="46.0" y="252.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">государства</text>
<text x="46.0" y="273.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">«Завоевание даёт титул,</text>
<text x="46.0" y="287.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">который суды завоевателя</text>
<text x="46.0" y="301.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">не могут отрицать»</text>
<path d="M203.0,225L210.0,225" stroke="#007A9A" stroke-width="2.2" marker-end="url(#head-m9)"/>
<rect x="212.0" y="120.0" width="168.0" height="210.0" rx="6" fill="#F8FAF6" fill-opacity="0.95"/>
<rect x="212.0" y="120.0" width="168.0" height="50.0" rx="6" fill="#007A9A" fill-opacity="0.9"/>
<text x="296.0" y="141.0" fill="#EDF0EA" font-size="14" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1831</text>
<text x="296.0" y="156.0" fill="#EDF0EA" font-size="11" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Cherokee Nation v.</text>
<text x="296.0" y="168.0" fill="#EDF0EA" font-size="11" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Georgia</text>
<text x="224.0" y="192.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">чероки — не иностранное</text>
<text x="224.0" y="207.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">государство; «внутренние</text>
<text x="224.0" y="222.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">зависимые нации» под</text>
<text x="224.0" y="237.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">опекой США</text>
<text x="224.0" y="258.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">«Их отношения с</text>
<text x="224.0" y="272.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">Соединёнными Штатами</text>
<text x="224.0" y="286.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">похожи на отношения</text>
<text x="224.0" y="300.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">подопечного к опекуну»</text>
<path d="M381.0,225L388.0,225" stroke="#007A9A" stroke-width="2.2" marker-end="url(#head-m9)"/>
<rect x="390.0" y="120.0" width="168.0" height="210.0" rx="6" fill="#F8FAF6" fill-opacity="0.95"/>
<rect x="390.0" y="120.0" width="168.0" height="50.0" rx="6" fill="#007A9A" fill-opacity="0.9"/>
<text x="474.0" y="141.0" fill="#EDF0EA" font-size="14" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1832</text>
<text x="474.0" y="156.0" fill="#EDF0EA" font-size="11" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Worcester v. Georgia</text>
<text x="402.0" y="192.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">законы Джорджии в стране</text>
<text x="402.0" y="207.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">чероки не имеют силы;</text>
<text x="402.0" y="222.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">народы — «обособленные</text>
<text x="402.0" y="237.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">политические сообщества»</text>
<text x="402.0" y="258.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">«Нация чероки —</text>
<text x="402.0" y="272.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">обособленное сообщество,</text>
<text x="402.0" y="286.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">занимающее свою</text>
<text x="402.0" y="300.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">территорию… в которой</text>
<text x="402.0" y="314.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">законы Джорджии не имеют</text>
<text x="402.0" y="328.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">силы»</text>
<path d="M559.0,225L566.0,225" stroke="#007A9A" stroke-width="2.2" marker-end="url(#head-m9)"/>
<rect x="568.0" y="120.0" width="168.0" height="210.0" rx="6" fill="#F8FAF6" fill-opacity="0.95"/>
<rect x="568.0" y="120.0" width="168.0" height="50.0" rx="6" fill="#5B6862" fill-opacity="0.5"/>
<text x="652.0" y="141.0" fill="#1B2420" font-size="14" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1871</text>
<text x="652.0" y="156.0" fill="#1B2420" font-size="11" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Конец договорного</text>
<text x="652.0" y="168.0" fill="#1B2420" font-size="11" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">периода</text>
<text x="580.0" y="192.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">племена больше не</text>
<text x="580.0" y="207.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">признаются договорами как</text>
<text x="580.0" y="222.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">независимые нации —</text>
<text x="580.0" y="237.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">старые договоры сохраняют</text>
<text x="580.0" y="252.0" fill="#1B2420" font-size="11.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">силу</text>
<text x="580.0" y="273.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">«Ни одна индейская нация</text>
<text x="580.0" y="287.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">или племя… не будет</text>
<text x="580.0" y="301.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">признана независимой</text>
<text x="580.0" y="315.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">нацией, племенем или</text>
<text x="580.0" y="329.0" fill="#5B6862" font-size="11" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-style="italic">державой»</text>
<text x="380.0" y="60.0" fill="#1B2420" font-size="15" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">три решения одного судьи — и акт, закрывший эпоху</text>
<text x="380.0" y="84.0" fill="#5B6862" font-size="12" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Джон Маршалл писал все три мнения Верховного суда</text>
<text x="380.0" y="360.0" fill="#1B2420" font-size="12" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1823: только государство может покупать землю · 1831: «подопечный и опекун»</text>
<text x="380.0" y="378.0" fill="#1B2420" font-size="12" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">· 1832: законы штата не имеют силы</text>
<text x="380.0" y="398.0" fill="#5B6862" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">четвёртая карточка отдельна: Конгресс, а не суд — и старые договоры сохраняют силу</text>
<text x="380.0" y="440.0" fill="#5B6862" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Схема по текстам решений (Justia) и 25 U.S.C. § 71; цитаты дословные</text>
<text x="380.0" y="456.0" fill="#1B2420" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">на практике Worcester исполнено не было: удаление чероки началось через шесть лет</text>
</svg>
