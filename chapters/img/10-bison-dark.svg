<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Бизоны: оценки с авторами, 1800–1900</title><desc id='d'>Логарифмическая шкала голов. Около 1800 г. — 30 млн (Айзенберг); 1870 г. — 5,5 млн (4 млн южнее Платт и 1,5 млн севернее — оценка Хорнадея); полоса 1872–1874 — убито 3 158 730 бизонов южного стада; к концу сезона 1875 г. южное стадо перестало существовать; 1881 — около 1 млн северного стада (оценка охотников); 1889 — 1091 живой бизон по переписи Хорнадея; 1900 — менее тысячи (Айзенберг). Оценки с авторами; среднего нет намеренно.</desc>
