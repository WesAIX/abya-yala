<title id='t'>Синхронный финал: четыре страны, одна шкала</title><desc id='d'>Шкала 1860–1890, четыре дорожки. США: Эдоуби-Уоллс 1874, война на Ред-Ривер 1874–1875, ссылка в Форт-Мэрион 1875, золото Блэк-Хиллс 1874, Великая война сиу 1876–1877, конфискация Блэк-Хиллс 1877, не-персе 1877, Джеронимо 1886. Канада: Договор 6 (1876), голод 1879–1882, восстание 1885. Чили: умирение Араукании 1862–1883, редукции 1884–1929. Аргентина: пленные Мендосы 1878–1889, кампания Роки 1879–1885, Инакаяль 1884. Полоса-фон — «синхронное десятилетие» 1875–1885.</desc>
