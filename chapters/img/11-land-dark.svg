<title id='t'>Земля и люди в эпоху ассимиляции</title><desc id='d'>Слева — столбцы индейской земли: 138 млн акров в 1887 г., 48 млн к 1934 г. (две трети утрачено), 56,2 млн сегодня. Справа — население по переписям: 248 253 (1890), 237 196 (1900), 265 683 (1910), 244 437 (1920), 332 397 (1930) — минимум на 1900 год и рост после. Земля — сводка BIA; население — подсчёт Арнера (1937) с его предостережением о методе.</desc>
