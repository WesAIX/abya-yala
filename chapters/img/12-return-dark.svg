<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Демографическое возвращение по переписям США</title><desc id='d'>Логарифмическая шкала. Слева — линейный ряд 1890–1930 (248 253, 237 196, 265 683, 244 437, 332 397 — переписи, подсчёт Арнера). Затем разрыв и точка 2020 года — 9,7 млн (одна раса или в комбинации; 3,7 млн — только AIAN). Пунктир между рядами: ряды несопоставимы, рост — в основном самоидентификация. Промежуточные десятилетия не сверены — разрыв показан разрывом, а не линией.</desc>
