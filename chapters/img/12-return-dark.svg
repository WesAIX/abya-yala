<text x="472.5" y="226.3" fill="#97A59E" font-size="11.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" paint-order="stroke" stroke="#141A18" stroke-width="4" stroke-linejoin="round">рост — в основном самоидентификация</text>
<text x="720.0" y="404.0" fill="#97A59E" font-size="10.5" text-anchor="end" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1890–1930 — подсчёт Арнера (1937); 2020 — перепись США;</text>
