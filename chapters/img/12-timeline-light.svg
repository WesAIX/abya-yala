<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 932" width="760" height="932" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Возвращение через право: вехи 1934–2024</title><desc id='d'>Шкала 1930–2030, три дорожки. США: реорганизация 1934, ДАИ 1968, Алькатраз 1969–1971, Вундед-Ни 1973, самоопределение 1975, ICWA 1978, IGRA 1988, NAGPRA 1990 и правило 2024, терминация 1953 (резолюция 108 и PL-280), Никсон 1970, McGirt 2020. Канада: Calder 1973, ст. 35 (1982), Delgamuukw 1997, Нунавут 1993–1999, Tsilhqot'in 2014, Комиссия примирения 2015. Мир и Латинская Америка: Конвенция МОТ 169 (1989), сапатисты 1994, Декларация ООН 2007, Эквадор 2008, Боливия 2009, Чили 2022. Цвет — тип акта.</desc>
