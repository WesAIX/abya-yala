<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Шесть сквозных механизмов</title><desc id='d'>Шесть карточек по кольцу: Сети; Демографический шок; Централизация — мобильность; Рычаг противоречий; Ресурсная база; Право как поздняя сила. В центре — «народы как действующие лица». Схема: авторское обобщение глав 3–12, не хронология.</desc>
<rect width="760" height="560" fill="#141A18"/>
<rect x="282.0" y="73.0" width="196.0" height="74.0" rx="6" fill="#2A9CC4" fill-opacity="0.16"/>
<rect x="282.0" y="73.0" width="196.0" height="24.0" rx="6" fill="#2A9CC4" fill-opacity="0.85"/>
<text x="380.0" y="90.0" fill="#141A18" font-size="11" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Сети</text>
<text x="380.0" y="112.0" fill="#E2E8E3" font-size="10" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">вещи, болезни, лошади, ружья</text>
<text x="380.0" y="126.0" fill="#E2E8E3" font-size="10" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">идут цепочками — быстрее армий</text>
<text x="380.0" y="141.0" fill="#97A59E" font-size="9.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">гл. 3, 5, 7</text>
<rect x="434.4" y="161.0" width="196.0" height="74.0" rx="6" fill="#BA8628" fill-opacity="0.16"/>
<rect x="434.4" y="161.0" width="196.0" height="24.0" rx="6" fill="#BA8628" fill-opacity="0.85"/>
<text x="532.4" y="178.0" fill="#141A18" font-size="11" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Демографический шок</text>
<text x="532.4" y="200.0" fill="#E2E8E3" font-size="10" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">убыль ~90% за столетие</text>
<text x="532.4" y="214.0" fill="#E2E8E3" font-size="10" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">убивала связка, не одна болезнь</text>
<text x="532.4" y="229.0" fill="#97A59E" font-size="9.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">гл. 5</text>
<rect x="434.4" y="337.0" width="196.0" height="74.0" rx="6" fill="#CF60A5" fill-opacity="0.16"/>
<rect x="434.4" y="337.0" width="196.0" height="24.0" rx="6" fill="#CF60A5" fill-opacity="0.85"/>
<text x="532.4" y="354.0" fill="#141A18" font-size="11" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Централизация — мобильность</text>
<text x="532.4" y="376.0" fill="#E2E8E3" font-size="10" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">пирамиду берут целиком,</text>
<text x="532.4" y="390.0" fill="#E2E8E3" font-size="10" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">сеть нельзя обезглавить</text>
<text x="532.4" y="405.0" fill="#97A59E" font-size="9.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">гл. 4, 6</text>
<rect x="282.0" y="368.0" width="196.0" height="74.0" rx="6" fill="#62A443" fill-opacity="0.16"/>
<rect x="282.0" y="368.0" width="196.0" height="24.0" rx="6" fill="#62A443" fill-opacity="0.85"/>
<text x="380.0" y="385.0" fill="#141A18" font-size="11" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Рычаг противоречий</text>
<text x="380.0" y="407.0" fill="#E2E8E3" font-size="10" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">силен, пока держав много;</text>
<text x="380.0" y="421.0" fill="#E2E8E3" font-size="10" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1763 и 1815 ломают его</text>
<text x="380.0" y="436.0" fill="#97A59E" font-size="9.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">гл. 8</text>
<rect x="129.6" y="337.0" width="196.0" height="74.0" rx="6" fill="#2A9CC4" fill-opacity="0.16"/>
<rect x="129.6" y="337.0" width="196.0" height="24.0" rx="6" fill="#2A9CC4" fill-opacity="0.85"/>
<text x="227.6" y="354.0" fill="#141A18" font-size="11" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Ресурсная база</text>
<text x="227.6" y="376.0" fill="#E2E8E3" font-size="10" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">бизон, пастбища, земля:</text>
<text x="227.6" y="390.0" fill="#E2E8E3" font-size="10" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">финал делает рынок</text>
<text x="227.6" y="405.0" fill="#97A59E" font-size="9.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">гл. 10, 11</text>
<rect x="129.6" y="161.0" width="196.0" height="74.0" rx="6" fill="#BA8628" fill-opacity="0.16"/>
<rect x="129.6" y="161.0" width="196.0" height="24.0" rx="6" fill="#BA8628" fill-opacity="0.85"/>
<text x="227.6" y="178.0" fill="#141A18" font-size="11" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Право как поздняя сила</text>
<text x="227.6" y="200.0" fill="#E2E8E3" font-size="10" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">договоры отняли —</text>
<text x="227.6" y="214.0" fill="#E2E8E3" font-size="10" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">договоры вернули</text>
<text x="227.6" y="229.0" fill="#97A59E" font-size="9.5" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">гл. 9, 12</text>
<path d="M380.0,110.0Q427.3,204.2 532.4,198.0" fill="none" stroke="#97A59E" stroke-width="1.4" stroke-dasharray="4 4" opacity=".75"/>
<path d="M532.4,198.0Q474.5,286.0 532.4,374.0" fill="none" stroke="#97A59E" stroke-width="1.4" stroke-dasharray="4 4" opacity=".75"/>
<path d="M532.4,374.0Q427.3,367.8 380.0,462.0" fill="none" stroke="#97A59E" stroke-width="1.4" stroke-dasharray="4 4" opacity=".75"/>
<path d="M380.0,462.0Q332.7,367.8 227.6,374.0" fill="none" stroke="#97A59E" stroke-width="1.4" stroke-dasharray="4 4" opacity=".75"/>
<path d="M227.6,374.0Q285.5,286.0 227.6,198.0" fill="none" stroke="#97A59E" stroke-width="1.4" stroke-dasharray="4 4" opacity=".75"/>
<circle cx="380.0" cy="286" r="52" fill="#1F2825"/>
<text x="380.0" y="278.0" fill="#E2E8E3" font-size="12.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">народы как</text>
<text x="380.0" y="294.0" fill="#E2E8E3" font-size="12.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">действующие</text>
<text x="380.0" y="310.0" fill="#E2E8E3" font-size="12.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">лица</text>
<text x="380.0" y="30.0" fill="#E2E8E3" font-size="15" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">шесть пружин обеих Америк</text>
<text x="380.0" y="494.0" fill="#97A59E" font-size="11" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Схема: авторское обобщение глав 3–12; не хронология —</text>
<text x="380.0" y="512.0" fill="#97A59E" font-size="11" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">доказательства каждой пружины — в названных главах</text>
<text x="380.0" y="540.0" fill="#97A59E" font-size="11.5" text-anchor="middle" font-weight="600" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Схема: обобщение конспекта</text>
</svg>
