<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-labelledby="t d" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<title id='t'>Шесть сквозных механизмов</title><desc id='d'>Шесть карточек по кольцу: Сети; Демографический шок; Централизация — мобильность; Рычаг противоречий; Ресурсная база; Право как поздняя сила. Спицы ведут от каждой пружины к центру — «народы как действующие лица». Схема: авторское обобщение глав 3–12, не хронология; доказательства — в названных главах.</desc>
<rect width="760" height="580" fill="#EDF0EA"/>
<circle cx="380.0" cy="304" r="64" fill="none" stroke="#C7CFC4" stroke-width="1"/>
<line x1="380.0" y1="114.0" x2="380.0" y2="238.0" stroke="#5B6862" stroke-width="1.2" stroke-opacity="0.55"/>
<circle cx="380.0" cy="238.0" r="2.2" stroke="#EDF0EA" stroke-width="5" fill="#EDF0EA"/><circle cx="380.0" cy="238.0" r="2.2" fill="#EDF0EA" stroke="#5B6862" stroke-width="1.6"/>
<line x1="612.1" y1="209.0" x2="441.1" y2="279.0" stroke="#5B6862" stroke-width="1.2" stroke-opacity="0.55"/>
