<circle cx="441.1" cy="329.0" r="2.2" stroke="#EDF0EA" stroke-width="5" fill="#EDF0EA"/><circle cx="441.1" cy="329.0" r="2.2" fill="#EDF0EA" stroke="#5B6862" stroke-width="1.6"/>
<line x1="380.0" y1="494.0" x2="380.0" y2="370.0" stroke="#5B6862" stroke-width="1.2" stroke-opacity="0.55"/>
<circle cx="380.0" cy="370.0" r="2.2" stroke="#EDF0EA" stroke-width="5" fill="#EDF0EA"/><circle cx="380.0" cy="370.0" r="2.2" fill="#EDF0EA" stroke="#5B6862" stroke-width="1.6"/>
<line x1="147.9" y1="399.0" x2="318.9" y2="329.0" stroke="#5B6862" stroke-width="1.2" stroke-opacity="0.55"/>
<circle cx="318.9" cy="329.0" r="2.2" stroke="#EDF0EA" stroke-width="5" fill="#EDF0EA"/><circle cx="318.9" cy="329.0" r="2.2" fill="#EDF0EA" stroke="#5B6862" stroke-width="1.6"/>
<line x1="147.9" y1="209.0" x2="318.9" y2="279.0" stroke="#5B6862" stroke-width="1.2" stroke-opacity="0.55"/>
<circle cx="318.9" cy="279.0" r="2.2" stroke="#EDF0EA" stroke-width="5" fill="#EDF0EA"/><circle cx="318.9" cy="279.0" r="2.2" fill="#EDF0EA" stroke="#5B6862" stroke-width="1.6"/>
<rect x="280.0" y="75.0" width="200.0" height="78.0" rx="6" fill="#F8FAF6" fill-opacity="1"/>
<rect x="280.0" y="75.0" width="4.0" height="78.0" rx="2" fill="#007A9A" fill-opacity="0.9"/>
<text x="296.0" y="97.0" fill="#007A9A" font-size="12" text-anchor="start" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Сети</text>
<text x="296.0" y="117.0" fill="#1B2420" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">вещи, болезни, лошади, ружья</text>
<text x="296.0" y="131.0" fill="#1B2420" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">идут цепочками — быстрее армий</text>
<text x="296.0" y="147.0" fill="#5B6862" font-size="9.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">гл. 3, 5, 7</text>
<rect x="512.1" y="170.0" width="200.0" height="78.0" rx="6" fill="#F8FAF6" fill-opacity="1"/>
<rect x="512.1" y="170.0" width="4.0" height="78.0" rx="2" fill="#A36A0E" fill-opacity="0.9"/>
<text x="528.1" y="192.0" fill="#A36A0E" font-size="12" text-anchor="start" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Демографический шок</text>
<text x="528.1" y="212.0" fill="#1B2420" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">убыль ~90% за столетие</text>
<text x="528.1" y="226.0" fill="#1B2420" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">убивала связка, не одна болезнь</text>
<text x="528.1" y="242.0" fill="#5B6862" font-size="9.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">гл. 5</text>
<rect x="512.1" y="360.0" width="200.0" height="78.0" rx="6" fill="#F8FAF6" fill-opacity="1"/>
<rect x="512.1" y="360.0" width="4.0" height="78.0" rx="2" fill="#B03A84" fill-opacity="0.9"/>
<text x="528.1" y="382.0" fill="#B03A84" font-size="10.5" text-anchor="start" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Централизация — мобильность</text>
<text x="528.1" y="402.0" fill="#1B2420" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">пирамиду берут целиком,</text>
<text x="528.1" y="416.0" fill="#1B2420" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">сеть нельзя обезглавить</text>
<text x="528.1" y="432.0" fill="#5B6862" font-size="9.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">гл. 4, 6</text>
<rect x="280.0" y="455.0" width="200.0" height="78.0" rx="6" fill="#F8FAF6" fill-opacity="1"/>
<rect x="280.0" y="455.0" width="4.0" height="78.0" rx="2" fill="#4F9A3A" fill-opacity="0.9"/>
<text x="296.0" y="477.0" fill="#4F9A3A" font-size="12" text-anchor="start" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Рычаг противоречий</text>
<text x="296.0" y="497.0" fill="#1B2420" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">силен, пока держав много;</text>
<text x="296.0" y="511.0" fill="#1B2420" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">1763 и 1815 ломают его</text>
<text x="296.0" y="527.0" fill="#5B6862" font-size="9.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">гл. 8</text>
<rect x="47.9" y="360.0" width="200.0" height="78.0" rx="6" fill="#F8FAF6" fill-opacity="1"/>
<rect x="47.9" y="360.0" width="4.0" height="78.0" rx="2" fill="#007A9A" fill-opacity="0.9"/>
<text x="63.9" y="382.0" fill="#007A9A" font-size="12" text-anchor="start" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Ресурсная база</text>
<text x="63.9" y="402.0" fill="#1B2420" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">бизон, пастбища, земля:</text>
<text x="63.9" y="416.0" fill="#1B2420" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">финал делает рынок</text>
<text x="63.9" y="432.0" fill="#5B6862" font-size="9.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">гл. 10, 11</text>
<rect x="47.9" y="170.0" width="200.0" height="78.0" rx="6" fill="#F8FAF6" fill-opacity="1"/>
<rect x="47.9" y="170.0" width="4.0" height="78.0" rx="2" fill="#A36A0E" fill-opacity="0.9"/>
<text x="63.9" y="192.0" fill="#A36A0E" font-size="12" text-anchor="start" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Право как поздняя сила</text>
<text x="63.9" y="212.0" fill="#1B2420" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">договоры отняли —</text>
<text x="63.9" y="226.0" fill="#1B2420" font-size="10.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">договоры вернули</text>
<text x="63.9" y="242.0" fill="#5B6862" font-size="9.5" text-anchor="start" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">гл. 9, 12</text>
<circle cx="380.0" cy="304" r="56" fill="#F8FAF6" stroke="#1B2420" stroke-width="1.2"/>
<text x="380.0" y="294.0" fill="#1B2420" font-size="12.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">народы как</text>
<text x="380.0" y="311.0" fill="#1B2420" font-size="12.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">действующие</text>
<text x="380.0" y="328.0" fill="#1B2420" font-size="12.5" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">лица</text>
<text x="380.0" y="30.0" fill="#1B2420" font-size="15" text-anchor="middle" font-weight="700" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">шесть пружин обеих Америк</text>
<text x="380.0" y="546.0" fill="#5B6862" font-size="11" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">Схема: авторское обобщение глав 3–12; не хронология —</text>
<text x="380.0" y="562.0" fill="#5B6862" font-size="11" text-anchor="middle" font-weight="400" font-family="'Alegreya Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">доказательства каждой пружины — в названных главах</text>
</svg>
