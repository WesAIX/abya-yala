[project]
name = "abya-yala"
version = "0.1.0"
description = "Инструменты проверки данных конспекта по истории коренных народов Америки"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23"]

[dependency-groups]
dev = ["ruff>=0.16"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Кириллица в строках и комментариях — норма для проекта, а не «похожие символы».
ignore = ["RUF001", "RUF002", "RUF003"]
